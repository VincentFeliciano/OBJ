<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBJ.52 — Not Found</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <style>
    @font-face {
      font-family: 'Satoshi';
      src: url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff2') format('woff2'),
           url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff') format('woff');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #0A0A0A;
      --gray-400: #A8A7A2;
      --gray-600: #6B6A65;
      --font: 'Satoshi', system-ui, sans-serif;
      --mono: 'Satoshi', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: #fff;
      font-family: var(--font);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--gray-400);
      margin-bottom: 28px;
    }

    .num {
      font-size: clamp(80px, 18vw, 220px);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--black);
      margin-bottom: 32px;
    }

    .message {
      font-size: 15px;
      line-height: 1.7;
      color: var(--gray-600);
      max-width: 340px;
      margin-bottom: 40px;
    }

    .back {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--black);
      text-decoration: none;
      border-bottom: 1px solid var(--black);
      padding-bottom: 2px;
      transition: color 0.15s, border-color 0.15s;
    }
    .back:hover { color: var(--gray-400); border-color: var(--gray-400); }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="label">OBJ.52 — PAGE NOT FOUND</p>
    <div class="num">404</div>
    <p class="message">This page doesn't exist or may have been moved. The archive is still there.</p>
    <a class="back" href="gallery.html">← BACK TO ARCHIVE</a>
  </div>
</body>
</html>
