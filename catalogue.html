<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBJ.52 — Objects Reformatted.</title>
  <meta name="description" content="An archive of restored, reimagined, and original objects.">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── HEADER ──────────────────────────── -->
  <header class="site-header">
    <div class="logo-block">
      <div class="logo-wordmark">OBJ.52</div>
      <div class="logo-tagline">Objects Reformatted.</div>
    </div>

    <nav class="filter-nav" id="filterNav" aria-label="Filter by status">
      <button class="filter-btn active" data-filter="all">ALL</button>
      <button class="filter-btn" data-filter="FOUND">FOUND</button>
      <button class="filter-btn" data-filter="RESTORED">RESTORED</button>
      <button class="filter-btn" data-filter="REFORMATTED">REFORMATTED</button>
      <button class="filter-btn" data-filter="CUSTOM">CUSTOM</button>
    </nav>

    <span class="header-count"><span id="pieceCount">4</span>&nbsp;OBJECTS</span>
  </header>

  <!-- ── ARCHIVE BAR ──────────────────────── -->
  <div class="archive-bar">
    <span class="archive-label">ARCHIVE</span>
    <div class="archive-track">
      <div class="archive-dot" id="archiveDot"></div>
    </div>
    <span class="archive-tagline">An archive of things worth keeping.</span>
  </div>

  <!-- ── GALLERY ──────────────────────────── -->
  <main>
    <section class="gallery-section">

      <div class="carousel" id="carousel" role="list" aria-label="Object gallery">
        <!-- Cards rendered by main.js -->
      </div>

      <!-- Desktop scroll hint -->
      <div class="carousel-hint" aria-hidden="true">
        <span>Scroll to explore</span>
        <svg width="28" height="9" viewBox="0 0 28 9" fill="none">
          <path d="M0 4.5h25M21.5 1l3 3.5-3 3.5" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </div>

      <!-- Mobile swipe dots -->
      <div class="swipe-dots" id="swipeDots" aria-hidden="true"></div>

    </section>
  </main>

  <!-- ── MODAL ────────────────────────────── -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-label="Piece detail">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="modal-body" id="modalBody">
        <!-- Injected by main.js -->
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Observer.min.js"></script>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
