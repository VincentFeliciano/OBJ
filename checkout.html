<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBJ.52 — Checkout</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    @font-face {
      font-family: 'Satoshi';
      src: url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff2') format('woff2'),
           url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff') format('woff');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #0A0A0A;
      --off:      #F7F6F2;
      --gray-100: #EFEEEA;
      --gray-200: #DDDCD8;
      --gray-400: #A8A7A2;
      --gray-600: #6B6A65;
      --font: 'Satoshi', system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--off);
      color: var(--black);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .co-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 40px;
      border-bottom: 1px solid var(--gray-200);
      background: #fff;
    }
    .co-logo { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: var(--black); text-decoration: none; }
    .co-back { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; color: var(--gray-400); text-decoration: none; transition: color 0.14s; }
    .co-back:hover { color: var(--black); }

    .co-body { max-width: 760px; margin: 0 auto; padding: 52px 40px 80px; }

    .co-title { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; color: var(--gray-600); margin-bottom: 32px; }

    .co-empty { text-align: center; padding: 80px 0; }
    .co-empty p { font-size: 14px; color: var(--gray-400); margin-bottom: 24px; letter-spacing: 0.04em; }
    .co-empty a { font-size: 10px; font-weight: 700; letter-spacing: 0.16em; color: var(--black); text-decoration: none; border-bottom: 1px solid var(--black); padding-bottom: 2px; }

    .co-item {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--gray-200);
    }
    .co-item-img { width: 72px; height: 72px; object-fit: cover; background: var(--gray-100); display: block; border-radius: 2px; }
    .co-item-desig { font-size: 9px; font-weight: 600; letter-spacing: 0.14em; color: var(--gray-400); margin-bottom: 4px; }
    .co-item-name  { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .co-item-price { font-size: 13px; font-weight: 500; color: var(--gray-600); }

    .co-pay-btn {
      display: inline-block;
      background: var(--black);
      color: #fff;
      font-family: var(--font);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      padding: 11px 20px;
      border-radius: 2px;
      text-decoration: none;
      transition: background 0.14s;
      white-space: nowrap;
    }
    .co-pay-btn:hover { background: #1a1a1a; }

    .co-contact-btn {
      display: inline-block;
      background: none;
      color: var(--gray-600);
      font-family: var(--font);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      padding: 10px 20px;
      border: 1px solid var(--gray-200);
      border-radius: 2px;
      text-decoration: none;
      transition: color 0.14s, border-color 0.14s;
      white-space: nowrap;
    }
    .co-contact-btn:hover { color: var(--black); border-color: var(--black); }

    .co-summary {
      border-top: 1px solid var(--black);
      padding-top: 20px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
    }
    .co-total-label  { font-size: 9px; font-weight: 700; letter-spacing: 0.18em; color: var(--gray-400); margin-bottom: 6px; }
    .co-total-amount { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }

    .co-note { margin-top: 20px; font-size: 11px; color: var(--gray-400); line-height: 1.7; }
    .co-stripe-badge { margin-top: 10px; font-size: 10px; color: var(--gray-400); letter-spacing: 0.04em; }

    @media (max-width: 600px) {
      .co-header { padding: 18px 20px; }
      .co-body   { padding: 36px 20px 60px; }
      .co-item   { grid-template-columns: 56px 1fr; grid-template-rows: auto auto; }
      .co-item-action { grid-column: 1 / -1; }
      .co-pay-btn, .co-contact-btn { width: 100%; text-align: center; display: block; }
    }
  </style>
</head>
<body>

<header class="co-header">
  <a class="co-logo" href="gallery.html">OBJ.52</a>
  <a class="co-back" href="gallery.html">← BACK TO GALLERY</a>
</header>

<main class="co-body">
  <div class="co-title">CHECKOUT</div>
  <div id="coContent"></div>
</main>

<script>
  function getCart() {
    /* Check URL param first (passed from gallery to work across all browsers/protocols) */
    try {
      const param = new URLSearchParams(window.location.search).get('cart');
      if (param) {
        const cart = JSON.parse(decodeURIComponent(param));
        if (Array.isArray(cart) && cart.length) return cart;
      }
    } catch {}
    /* Fall back to localStorage */
    try { return JSON.parse(localStorage.getItem('obj52_cart') || '[]'); } catch { return []; }
  }

  function render(pieces) {
    const cart = getCart();
    const el   = document.getElementById('coContent');

    if (!cart.length) {
      el.innerHTML = `
        <div class="co-empty">
          <p>Your cart is empty.</p>
          <a href="gallery.html">BROWSE THE ARCHIVE</a>
        </div>`;
      return;
    }

    const total = cart.reduce((sum, item) => {
      const n = parseFloat((item.price || '').replace(/[^0-9.]/g, ''));
      return sum + (isNaN(n) ? 0 : n);
    }, 0);

    const itemsHTML = cart.map(item => {
      /* Prefer image from PIECES if data.js loaded, otherwise blank placeholder */
      const p = pieces && pieces.find(p => p.id === item.id);
      const imgSrc = p && p.folder && p.images && p.images[0] ? `${p.folder}/${p.images[0]}` : '';

      /* paymentLink stored in cart at add-time; fall back to PIECES lookup */
      const link = item.paymentLink || (p && p.paymentLink) || '';
      const contactParams = new URLSearchParams({
        subject:     `Inquiry — ${item.designation}: ${item.name}`,
        name:        item.name,
        designation: item.designation,
      });
      const actionHTML = link
        ? `<a class="co-pay-btn" href="${link}" target="_blank" rel="noopener">PAY WITH STRIPE →</a>`
        : `<a class="co-contact-btn" href="contact.html?${contactParams}">INQUIRE →</a>`;

      return `
        <div class="co-item">
          ${imgSrc ? `<img class="co-item-img" src="${imgSrc}" alt="${item.name}">` : '<div class="co-item-img"></div>'}
          <div class="co-item-info">
            <div class="co-item-desig">${item.designation}</div>
            <div class="co-item-name">${item.name}</div>
            <div class="co-item-price">${item.price}</div>
          </div>
          <div class="co-item-action">${actionHTML}</div>
        </div>`;
    }).join('');

    el.innerHTML = `
      ${itemsHTML}
      <div class="co-summary">
        <div>
          <div class="co-total-label">ESTIMATED TOTAL</div>
          <div class="co-total-amount">$${total.toLocaleString('en-US', { minimumFractionDigits: 0 })}</div>
        </div>
      </div>
      <p class="co-note">Each piece is one-of-one. Click PAY WITH STRIPE on each item to purchase individually through Stripe's secure checkout. You'll receive a confirmation email after each purchase.</p>
      <p class="co-stripe-badge">Payments secured by Stripe · OBJ.52 does not store card details</p>
    `;
  }

  /* Render immediately from cart data — no dependency on data.js */
  render(null);

  /* Then load data.js to add images (progressive enhancement) */
  const s = document.createElement('script');
  s.src = 'data.js?v=' + Date.now();
  s.onload = () => render(typeof PIECES !== 'undefined' ? PIECES : null);
  document.head.appendChild(s);
</script>
</body>
</html>
