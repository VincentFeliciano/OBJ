<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBJ.52</title>
  <meta name="description" content="OBJ.52 — A restoration and design studio. Found objects, restored furniture, and one-of-one pieces from Saratoga Springs, NY.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <style>
    @font-face {
      font-family: 'Satoshi';
      src: url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff2') format('woff2'),
           url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff') format('woff');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #0A0A0A;
      --gray-400: #A8A7A2;
      --gray-600: #6B6A65;
      --font: 'Satoshi', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: var(--font);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Two-panel layout ── */
    .layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* ── Left: video ── */
    .video-panel {
      flex: 0 0 46%;
      position: relative;
      overflow: hidden;
      opacity: 0;
    }

    .video-panel video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Right: text ── */
    .text-panel {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 7vw 0 6vw;
    }

    .brand {
      font-size: clamp(52px, 7.5vw, 124px);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--black);
      opacity: 0;
      margin-bottom: 18px;
    }

    .tagline {
      font-family: var(--font);
      font-size: clamp(8px, 0.85vw, 11px);
      font-weight: 700;
      letter-spacing: 0.24em;
      color: var(--black);
      opacity: 0;
      margin-bottom: 40px;
    }

    .body-line {
      font-size: clamp(10px, 0.9vw, 12px);
      letter-spacing: 0.1em;
      line-height: 1.75;
      color: var(--gray-600);
      opacity: 0;
    }

    /* ── Enter Gallery — pinned to bottom of text panel ── */
    .enter-wrap {
      position: absolute;
      bottom: 8vh;
      left: 6vw;
      opacity: 0;
    }

    .enter {
      font-family: var(--font);
      font-size: clamp(14px, 1.4vw, 20px);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--black);
      text-decoration: none;
      transition: color 0.2s;
    }
    .enter:hover { color: var(--gray-400); }

    /* ── Mobile: stack panels ── */
    @media (max-width: 680px) {
      .layout { flex-direction: column; overflow-y: auto; }
      .video-panel { flex: 0 0 50vh; }
      .text-panel { justify-content: flex-start; padding: 40px 28px 100px; }
      .enter-wrap { position: relative; bottom: auto; left: auto; margin-top: 48px; }
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- Left: video -->
  <div class="video-panel" id="videoPanel">
    <video autoplay muted loop playsinline src="video1.mp4"></video>
  </div>

  <!-- Right: text -->
  <div class="text-panel">
    <div class="brand"   id="brand">OBJ.52</div>
    <div class="tagline" id="tagline">SOME THINGS ARE WORTH THE TROUBLE</div>
    <div class="body-line" id="line1">Objects selected for their integrity.</div>
    <div class="body-line" id="line2">Restored to last another generation.</div>

    <div class="enter-wrap" id="enterWrap">
      <a class="enter" href="gallery.html">Enter Gallery</a>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ defaults: { ease: 'power2.out' } });

  tl.to('#videoPanel', { opacity: 1, duration: 1.4 })
    .to('#brand',      { opacity: 1, duration: 0.7 }, '-=0.4')
    .to('#tagline',    { opacity: 1, duration: 0.6 }, '+=0.2')
    .to('#line1',      { opacity: 1, duration: 0.6 }, '+=0.25')
    .to('#line2',      { opacity: 1, duration: 0.6 }, '+=0.18')
    .to('#enterWrap',  { opacity: 1, duration: 0.7 }, '+=0.35');
</script>

</body>
</html>
