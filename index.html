<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OBJ.52</title>
  <meta name="description" content="OBJ.52 — A restoration and design studio. Found objects, restored furniture, and one-of-one pieces from Saratoga Springs, NY.">
  <meta property="og:title" content="OBJ.52">
  <meta property="og:description" content="An archive of things worth keeping. Found objects and restored furniture, one piece at a time.">
  <meta property="og:image" content="https://vincentfeliciano.github.io/OBJ/ARTIST.jpeg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <style>
    @font-face {
      font-family: 'Satoshi';
      src: url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff2') format('woff2'),
           url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff') format('woff');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #0A0A0A;
      --gray-400: #A8A7A2;
      --gray-600: #6B6A65;
      --font: 'Satoshi', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: var(--font);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Two-panel layout ── */
    .layout {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* ── Left: video — starts full-width, GSAP animates to 46vw ── */
    .video-panel {
      flex-shrink: 0;
      width: 100vw;
      position: relative;
      overflow: hidden;
    }

    .video-panel video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 32%;
      opacity: 0;
    }

    /* ── Right: text ── */
    .text-panel {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 5vw;
    }

    .brand {
      font-size: clamp(90px, 14vw, 220px);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--black);
      opacity: 0;
      margin-bottom: 18px;
    }

    .tagline {
      font-size: clamp(11px, 1.2vw, 15px);
      font-weight: 700;
      letter-spacing: 0.24em;
      color: var(--black);
      opacity: 0;
      margin-bottom: 40px;
    }

    .body-line {
      font-size: clamp(13px, 1.25vw, 17px);
      letter-spacing: 0.1em;
      line-height: 1.75;
      color: var(--gray-600);
      opacity: 0;
    }

    /* ── Enter Gallery — pinned to bottom of text panel ── */
    .enter-wrap {
      position: absolute;
      bottom: calc(8vh + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      white-space: nowrap;
    }

    .enter {
      font-size: clamp(18px, 1.9vw, 27px);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--black);
      text-decoration: none;
      transition: color 0.2s;
    }
    .enter:hover { color: var(--gray-400); }

    /* ── Mobile: text overlays the full-screen video ── */
    @media (max-width: 680px) {
      .layout { position: relative; }

      .video-panel {
        position: absolute;
        inset: 0;
        width: 100vw !important;
        height: 100vh;
      }

      .text-panel {
        position: relative;
        z-index: 1;
        height: 100vh;
        justify-content: center;
        padding: 0 32px 20vh;
        background: rgba(255, 255, 255, 0.55);
      }

      .tagline {
        color: #000;
        font-weight: 900;
      }

      .body-line {
        color: #000;
        font-weight: 700;
      }

      .enter-wrap {
        position: relative;
        bottom: auto;
        left: auto;
        transform: none;
        margin-top: 36px;
        white-space: nowrap;
      }

      .enter {
        font-size: clamp(22px, 5.5vw, 32px);
        font-weight: 700;
      }
    }
  </style>
</head>
<body>

<div class="layout">

  <div class="video-panel" id="videoPanel">
    <video id="vid0" muted playsinline src="video1.mp4"></video>
    <video id="vid1" muted playsinline src="video1a.mp4"></video>
  </div>

  <div class="text-panel" id="textPanel">
    <div class="brand"     id="brand">OBJ.52</div>
    <div class="tagline"   id="tagline">SOME THINGS ARE WORTH THE TROUBLE</div>
    <div class="body-line" id="line1">Objects selected for their integrity. Restored to last another generation.</div>

    <div class="enter-wrap" id="enterWrap">
      <a class="enter" href="gallery.html">Enter Gallery</a>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  /* ── Video alternation: randomly pick first, crossfade on end ── */
  const vids = [document.getElementById('vid0'), document.getElementById('vid1')];
  let cur = Math.random() < 0.5 ? 0 : 1;

  function startVideo(idx) {
    const active = vids[idx];
    const inactive = vids[1 - idx];
    active.currentTime = 0;
    active.play();
    gsap.to(active,   { opacity: 1, duration: 0.8, ease: 'power2.inOut' });
    gsap.to(inactive, { opacity: 0, duration: 0.8, ease: 'power2.inOut' });
  }

  vids.forEach((v, i) => {
    v.addEventListener('ended', () => {
      cur = 1 - cur;
      startVideo(cur);
    });
  });

  startVideo(cur);

  const tl = gsap.timeline({ defaults: { ease: 'power2.out' } });

  /* Video holds full-screen briefly, then slides left */
  tl.to('#videoPanel', { width: '46vw', duration: 1.3, ease: 'power3.inOut' }, 0.6)

  /* Text fades in line by line as video settles */
    .to('#brand',     { opacity: 1, duration: 0.7 }, '-=0.5')
    .to('#tagline',   { opacity: 1, duration: 0.6 }, '+=0.2')
    .to('#line1',     { opacity: 1, duration: 0.6 }, '+=0.25')
    .to('#enterWrap', { opacity: 1, duration: 0.7 }, '+=0.35');
</script>

</body>
</html>
