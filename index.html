<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBJ.52</title>

  <style>
    @font-face {
      font-family: 'Satoshi';
      src: url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff2') format('woff2'),
           url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff') format('woff');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Satoshi';
      src: url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-VariableItalic.woff2') format('woff2'),
           url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-VariableItalic.woff') format('woff');
      font-weight: 300 900;
      font-style: italic;
      font-display: swap;
    }
  </style>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #0A0A0A;
      --gray-100: #EFEEEA;
      --gray-400: #A8A7A2;
      --gray-600: #6B6A65;
      --font: 'Satoshi', system-ui, sans-serif;
      --mono: 'Satoshi', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: var(--font);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Splash wrapper ── */
    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    /* ── Eyebrow ── */
    .splash-eyebrow {
      font-family: var(--mono);
      font-size: clamp(8px, 1vw, 10px);
      letter-spacing: 0.22em;
      color: var(--gray-400);
      margin-bottom: clamp(20px, 3vh, 36px);
      opacity: 0;
      text-transform: uppercase;
    }

    /* ── Brand mark ── */
    .splash-brand {
      display: flex;
      align-items: baseline;
      line-height: 1;
      white-space: nowrap;
    }

    .splash-obj {
      font-size: clamp(72px, 14vw, 200px);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--black);
      display: inline-block;
      will-change: transform;
    }

    .splash-num {
      font-size: clamp(72px, 14vw, 200px);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--black);
      display: inline-block;
      /* fixed width prevents layout shift while numbers scramble */
      min-width: 2.1ch;
      font-variant-numeric: tabular-nums;
      will-change: contents;
    }

    /* ── Enter button ── */
    .splash-enter {
      margin-top: clamp(32px, 5vh, 56px);
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: clamp(9px, 1.1vw, 11px);
      font-weight: 700;
      letter-spacing: 0.24em;
      color: var(--gray-600);
      cursor: pointer;
      padding: 12px 0;
      opacity: 0;
      transition: color 0.2s;
      text-transform: uppercase;
    }

    .splash-enter:hover { color: var(--black); }

    /* Arrow nudge on hover */
    .splash-enter .arr {
      display: inline-block;
      transition: transform 0.2s;
    }
    .splash-enter:hover .arr { transform: translateX(5px); }

    /* ── Thin bottom line ── */
    .splash-line {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.18em;
      color: var(--gray-400);
      opacity: 0;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .splash-obj,
      .splash-num {
        font-size: clamp(52px, 18vw, 100px);
      }
    }
  </style>
</head>
<body>

  <div class="splash" id="splash">
    <p class="splash-eyebrow" id="splashEyebrow">An archive of things worth keeping</p>

    <div class="splash-brand">
      <span class="splash-obj" id="splashObj">OBJ.</span>
      <span class="splash-num" id="splashNum">00</span>
    </div>

    <button class="splash-enter" id="splashEnter">
      ENTER ARCHIVE <span class="arr">→</span>
    </button>
  </div>

  <p class="splash-line" id="splashLine">SARATOGA SPRINGS, NY &nbsp;·&nbsp; OBJECTS / RESTORATION / DESIGN</p>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const objEl    = document.getElementById('splashObj');
    const numEl    = document.getElementById('splashNum');
    const enterBtn = document.getElementById('splashEnter');
    const eyebrow  = document.getElementById('splashEyebrow');
    const line     = document.getElementById('splashLine');

    /* ── Start OBJ. off-screen left ── */
    gsap.set(objEl, { x: '-110vw' });
    gsap.set(numEl, { opacity: 0 });

    /* ── Number scramble state ── */
    const counter = { val: 0 };

    const tl = gsap.timeline({ delay: 0.15 });

    /* Phase 1: OBJ. races in from the left */
    tl.to(objEl, {
      x: 0,
      duration: 1.3,
      ease: 'power3.out',
    }, 0);

    /* Phase 1 simultaneous: numbers flash in and scramble */
    tl.to(numEl, { opacity: 1, duration: 0.08 }, 0);

    tl.to(counter, {
      val: 52,
      duration: 1.9,
      ease: 'power4.out',
      onUpdate() {
        const p = tl.progress();          /* timeline progress 0→1 */
        const v = counter.val;
        if (p < 0.72) {
          /* fast random phase — numbers race past */
          numEl.textContent = String(Math.floor(Math.random() * 99) + 1).padStart(2, '0');
        } else if (p < 0.92) {
          /* settling phase — show nearby values */
          const spread = Math.floor((1 - (p - 0.72) / 0.2) * 12);
          const shown  = Math.max(1, Math.round(v) + Math.floor((Math.random() - 0.5) * spread));
          numEl.textContent = String(Math.min(shown, 99)).padStart(2, '0');
        } else {
          /* lock in */
          numEl.textContent = String(Math.round(v)).padStart(2, '0');
        }
      },
      onComplete() {
        numEl.textContent = '52';
      }
    }, 0);

    /* Phase 2: eyebrow fades in as brand settles */
    tl.to(eyebrow, { opacity: 1, duration: 0.55, ease: 'power2.out' }, 1.55);

    /* Phase 3: enter button appears */
    tl.to(enterBtn, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 1.85);

    /* Phase 4: footer line */
    tl.to(line, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 2.1);

    /* ── Enter gallery ── */
    enterBtn.addEventListener('click', () => {
      gsap.to('#splash', {
        opacity: 0,
        duration: 0.45,
        ease: 'power2.in',
        onComplete: () => {
          window.location.href = 'gallery.html';
        }
      });
      gsap.to('.splash-line', { opacity: 0, duration: 0.3 });
    });

    /* Allow keyboard Enter too */
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && enterBtn.style.opacity !== '0') enterBtn.click();
    });
  </script>

</body>
</html>
