<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBJ.52 — Gallery</title>

  <style>
    @font-face {
      font-family: 'Satoshi';
      src: url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff2') format('woff2'),
           url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff')  format('woff');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Satoshi';
      src: url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-VariableItalic.woff2') format('woff2'),
           url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-VariableItalic.woff')  format('woff');
      font-weight: 300 900;
      font-style: italic;
      font-display: swap;
    }
  </style>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:     #0A0A0A;
      --white:     #FFFFFF;
      --off-white: #F7F6F2;
      --gray-100:  #EFEEEA;
      --gray-200:  #DDDCD8;
      --gray-400:  #A8A7A2;
      --gray-600:  #6B6A65;
      --font: 'Satoshi', system-ui, sans-serif;
      --mono: 'Satoshi', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: var(--font);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── BACKGROUND WATERMARK ─────────────── */

    .bg-wordmark {
      position: fixed;
      bottom: -0.1em;
      left: -0.02em;
      font-family: var(--font);
      font-size: 5vw;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--black);
      opacity: 0.25;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      white-space: nowrap;
    }

    /* ─── TOP LEFT ─────────────────────────── */

    .g2-topcorner {
      position: fixed;
      top: 20px;
      left: 22px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .g2-catalogue-link {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--gray-400);
      text-decoration: none;
      transition: color 0.14s;
    }

    .g2-catalogue-link:hover { color: var(--black); }

    .g2-menu-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--gray-400);
    }

    /* ─── GALLERY CANVAS ───────────────────── */

    .gallery-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ─── COLUMNS ──────────────────────────── */

    .g-col {
      position: absolute;
      top: 0;
      display: flex;
      flex-direction: column;
      gap: 72px;          /* ITEM_GAP — must match JS constant */
      will-change: transform;
    }

    #col0 { left: 17vw; width: 32vw; }
    #col1 { left: 59vw; width: 29vw; }

    /* ─── GALLERY ITEMS ────────────────────── */

    .g-item {
      flex: 0 0 auto;
      /* aspect-ratio gives items a CSS-determined height immediately,
         independent of image load state — same principle as the
         main carousel cards. This prevents jitter on wrap. */
      aspect-ratio: 3 / 4;
      overflow: hidden;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .g-item.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .g-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .g-item:hover img { transform: scale(1.03); }

    /* ─── DETAIL VIEW (UI2) ────────────────── */

    .detail-view {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s ease;
    }

    .detail-view.open {
      opacity: 1;
      pointer-events: all;
    }

    /* Close button */
    .detail-close {
      position: absolute;
      top: 22px;
      right: 24px;
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.14em;
      color: var(--gray-400);
      cursor: pointer;
      z-index: 10;
      transition: color 0.14s;
      padding: 4px;
    }

    .detail-close:hover { color: var(--black); }

    /* Image side */
    .detail-image {
      flex: 0 0 62%;
      background: #E8E8E5;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      padding: 60px;
    }

    /* Text side */
    .detail-text {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── PINNED HEADER (name + subtitle + thumbs) ── */
    .dt-pinned-top {
      flex-shrink: 0;
      padding: 36px 32px 18px;
      border-bottom: 1px solid var(--gray-100);
    }

    /* ─── SCROLLABLE MIDDLE ─────────────────────── */
    .dt-body-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px 32px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--gray-200) transparent;
    }

    .dt-body-scroll::-webkit-scrollbar       { width: 4px; }
    .dt-body-scroll::-webkit-scrollbar-track { background: transparent; }
    .dt-body-scroll::-webkit-scrollbar-thumb { background: var(--gray-200); }

    /* ─── PINNED FOOTER (price + buttons) ──────── */
    .dt-pinned-bot {
      flex-shrink: 0;
      padding: 16px 32px 24px;
      border-top: 1px solid var(--gray-100);
      background: #fff;
    }

    /* ─── ADD TO CART BUTTON ────────────────────── */
    .dt-add-cart {
      display: block;
      width: 100%;
      background: none;
      border: 1px solid var(--black);
      color: var(--black);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      padding: 14px 20px;
      text-align: center;
      cursor: pointer;
      border-radius: 2px;
      margin-top: 8px;
      transition: background 0.14s, color 0.14s;
    }

    .dt-add-cart:hover, .dt-add-cart.in-cart {
      background: var(--black);
      color: #fff;
    }

    .dt-add-cart.sold-out {
      background: none;
      color: var(--gray-400);
      border-color: var(--gray-200);
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* ─── CART BUTTON (top nav) ─────────────────── */
    .g2-cart-btn {
      position: relative;
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--gray-400);
      cursor: pointer;
      padding: 0;
      transition: color 0.14s;
    }

    .g2-cart-btn:hover { color: var(--black); }

    .cart-badge {
      position: absolute;
      top: -6px;
      right: -10px;
      background: var(--black);
      color: #fff;
      font-size: 7px;
      font-weight: 700;
      min-width: 14px;
      height: 14px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      letter-spacing: 0;
    }

    .cart-badge.hidden { display: none; }

    /* ─── CART PANEL ────────────────────────────── */
    .cart-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 360px;
      height: 100%;
      background: #fff;
      z-index: 500;
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 32px rgba(0,0,0,0.1);
      transition: right 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .cart-panel.open { right: 0; }

    .cart-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 24px;
      border-bottom: 1px solid var(--gray-100);
      flex-shrink: 0;
    }

    .cart-panel-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--black);
    }

    .cart-panel-close {
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--gray-400);
      cursor: pointer;
      transition: color 0.14s;
    }

    .cart-panel-close:hover { color: var(--black); }

    .cart-items-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 24px;
    }

    .cart-empty-msg {
      font-size: 13px;
      color: var(--gray-400);
      font-style: italic;
      padding: 16px 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 14px 0;
      border-bottom: 1px solid var(--gray-100);
    }

    .cart-item-info { flex: 1; }

    .cart-item-desig {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.1em;
      color: var(--gray-400);
      margin-bottom: 3px;
    }

    .cart-item-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--black);
      margin-bottom: 4px;
    }

    .cart-item-price {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--gray-600);
    }

    .cart-item-remove {
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.08em;
      color: var(--gray-400);
      cursor: pointer;
      padding: 2px 0 0 14px;
      flex-shrink: 0;
      transition: color 0.14s;
    }

    .cart-item-remove:hover { color: var(--black); }

    .cart-panel-footer {
      flex-shrink: 0;
      padding: 16px 24px 28px;
      border-top: 1px solid var(--gray-100);
    }

    .cart-count-line {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--gray-600);
      margin-bottom: 14px;
    }

    .cart-checkout-btn {
      display: block;
      width: 100%;
      background: var(--black);
      color: #fff;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      padding: 15px 20px;
      text-align: center;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.14s;
    }

    .cart-checkout-btn:hover { background: #1a1a1a; }

    /* Text blocks */
    .dt-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 3px;
      color: var(--black);
    }

    .dt-subtitle {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--gray-400);
      margin-bottom: 14px;
    }

    .dt-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--gray-400);
      margin-top: 20px;
      margin-bottom: 5px;
    }

    .dt-body {
      font-size: 14px;
      line-height: 1.75;
      color: var(--gray-600);
      font-weight: 300;
      margin-bottom: 4px;
    }

    .dt-list {
      list-style: none;
      padding: 0;
    }

    .dt-list li {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.07em;
      color: var(--gray-600);
      line-height: 1.9;
    }

    .dt-value {
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.05em;
      color: var(--black);
      line-height: 1.8;
    }

    .dt-timeline-row {
      display: flex;
      gap: 14px;
      padding: 3px 0;
    }

    .dt-year {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--gray-400);
      flex-shrink: 0;
      min-width: 72px;
      padding-top: 1px;
    }

    .dt-event {
      font-size: 13px;
      color: var(--gray-600);
      line-height: 1.6;
    }

    .dt-price {
      font-family: var(--mono);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
      color: var(--black);
    }

    .dt-cta {
      display: block;
      width: 100%;
      background: var(--black);
      color: #fff;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      padding: 14px 20px;
      text-align: center;
      text-decoration: none;
      border-radius: 2px;
      transition: background 0.14s;
      margin-bottom: 0;
    }

    .dt-cta:hover { background: #1a1a1a; }

    /* Archive notes in detail view */
    .dt-comments-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .dt-views {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--gray-400);
    }

    .dt-no-comments {
      font-size: 13px;
      color: var(--gray-400);
      font-style: italic;
      padding: 8px 0;
    }

    .dt-comment-item { padding: 10px 0; border-bottom: 1px solid var(--gray-100); }

    .dt-comment-meta {
      display: flex; gap: 10px; align-items: baseline; margin-bottom: 4px;
    }

    .dt-comment-name {
      font-family: var(--mono); font-size: 8.5px; font-weight: 700;
      letter-spacing: 0.1em; color: var(--black);
    }

    .dt-comment-date {
      font-family: var(--mono); font-size: 7.5px; color: var(--gray-400);
    }

    .dt-comment-text {
      font-size: 11.5px; line-height: 1.65; color: var(--gray-600);
      font-weight: 300; margin: 0;
    }

    .dt-comment-form { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }

    .dt-input, .dt-textarea {
      width: 100%; background: #F7F6F2; border: 1px solid var(--gray-200);
      border-radius: 3px; font-family: var(--font); font-size: 11.5px;
      color: var(--black); padding: 9px 12px; outline: none; resize: none;
      transition: border-color 0.14s;
    }

    .dt-input:focus, .dt-textarea:focus { border-color: var(--black); }
    .dt-input::placeholder, .dt-textarea::placeholder { color: var(--gray-400); }
    .dt-textarea { min-height: 70px; }

    .dt-submit {
      align-self: flex-end; background: none; border: 1px solid var(--black);
      color: var(--black); font-family: var(--mono); font-size: 8.5px;
      font-weight: 700; letter-spacing: 0.16em; padding: 9px 18px;
      cursor: pointer; border-radius: 2px; transition: background 0.14s, color 0.14s;
    }

    .dt-submit:hover { background: var(--black); color: #fff; }

    /* ─── IMAGE THUMBNAILS ──────────────────── */

    .dt-thumbs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0 24px;
    }

    .dt-thumb {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.16s, opacity 0.16s;
      flex-shrink: 0;
    }

    .dt-thumb:hover  { opacity: 0.8; }
    .dt-thumb.active { border-color: var(--black); }

    .dt-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      display: block;
    }

    /* ─── MENU BUTTON ───────────────────────── */

    .g2-menu-btn {
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--gray-400);
      cursor: pointer;
      padding: 0;
      transition: color 0.14s;
    }

    .g2-menu-btn:hover { color: var(--black); }

    /* ─── MENU CARD (scrolls in col1) ───────── */

    .menu-card { aspect-ratio: 3 / 4; }

    .menu-card-inner {
      width: 100%;
      height: 100%;
      background: var(--gray-100);
      display: flex;
      flex-direction: column;
      padding: 22px 20px 20px;
    }

    .menu-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    .menu-card-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--gray-400);
    }

    .menu-card-close {
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--gray-400);
      cursor: pointer;
      padding: 0;
      transition: color 0.14s;
    }

    .menu-card-close:hover { color: var(--black); }

    .menu-card-nav {
      display: flex;
      flex-direction: column;
      gap: 0;
      flex: 1;
    }

    .menu-card-nav a {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.25;
      color: var(--black);
      text-decoration: none;
      transition: color 0.14s;
    }

    .menu-card-nav a:hover { color: var(--gray-400); }

    .menu-card-section-label {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.14em;
      color: var(--gray-400);
      margin-bottom: 10px;
    }

    .menu-card-filters {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 20px;
    }

    .menu-filter-btn {
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--gray-200);
      cursor: pointer;
      text-align: left;
      padding: 3px 0;
      transition: color 0.14s;
      line-height: 1.1;
    }

    .menu-filter-btn:hover  { color: var(--gray-400); }
    .menu-filter-btn.active { color: var(--black); }

    .menu-card-divider {
      height: 1px;
      background: var(--gray-200);
      margin: 16px 0;
      opacity: 0.3;
    }

    .menu-card-footer {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.1em;
      color: var(--gray-400);
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- Watermark -->
  <div class="bg-wordmark">OBJ.52</div>

  <!-- Top left -->
  <div class="g2-topcorner">
    <button class="g2-menu-btn" id="menuBtn">MENU</button>
  </div>

  <!-- Gallery -->
  <div class="gallery-canvas" id="galleryCanvas">
    <div class="g-col" id="col0"></div>
    <div class="g-col" id="col1"></div>
  </div>

  <!-- Detail view (UI2) -->
  <div class="detail-view" id="detailView" role="dialog" aria-modal="true">
    <button class="detail-close" id="detailClose">CLOSE</button>
    <div class="detail-image" id="detailImage"></div>
    <div class="detail-text" id="detailText"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Observer.min.js"></script>
  <script src="data.js"></script>
  <script src="main2.js"></script>
</body>
</html>
