<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBJ.52</title>
  <meta name="description" content="OBJ.52 — A restoration and design studio. Found objects, restored furniture, and one-of-one pieces from Saratoga Springs, NY.">
  <meta property="og:title" content="OBJ.52">
  <meta property="og:description" content="An archive of things worth keeping. Found objects and restored furniture, one piece at a time.">
  <meta property="og:image" content="https://vincentfeliciano.github.io/OBJ/ARTIST.jpeg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <style>
    @font-face {
      font-family: 'Satoshi';
      src: url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff2') format('woff2'),
           url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-Variable.woff') format('woff');
      font-weight: 300 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Satoshi';
      src: url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-VariableItalic.woff2') format('woff2'),
           url('Satoshi_Complete/Fonts/WEB/fonts/Satoshi-VariableItalic.woff') format('woff');
      font-weight: 300 900;
      font-style: italic;
      font-display: swap;
    }
  </style>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:    #0A0A0A;
      --gray-100: #EFEEEA;
      --gray-400: #A8A7A2;
      --gray-600: #6B6A65;
      --font: 'Satoshi', system-ui, sans-serif;
      --mono: 'Satoshi', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: var(--font);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Splash wrapper ── */
    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    /* ── Eyebrow ── */
    .splash-eyebrow {
      font-family: var(--mono);
      font-size: clamp(10px, 1.2vw, 13px);
      letter-spacing: 0.22em;
      color: var(--gray-600);
      margin-bottom: clamp(20px, 3vh, 36px);
      opacity: 0;
      text-transform: uppercase;
    }

    /* ── Brand mark ── */
    .splash-brand {
      display: flex;
      align-items: baseline;
      line-height: 1;
      white-space: nowrap;
    }

    .splash-obj {
      font-size: clamp(80px, 28vw, 650px);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--black);
      display: inline-block;
      will-change: transform;
    }

    /* ── Odometer clip window ── */
    .splash-num-wrap {
      display: inline-block;
      overflow: hidden;
      vertical-align: top;
      /* height set by JS after fonts render */
    }

    /* ── Scrolling strip inside the clip ── */
    .splash-num-strip {
      display: flex;
      flex-direction: column;
      will-change: transform;
    }

    .splash-num-strip span {
      display: block;
      font-size: clamp(80px, 28vw, 650px);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--black);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ── Enter button ── */
    .splash-enter {
      margin-top: clamp(32px, 5vh, 56px);
      background: none;
      border: none;
      font-family: var(--mono);
      font-size: clamp(11px, 1.3vw, 14px);
      font-weight: 700;
      letter-spacing: 0.24em;
      color: var(--black);
      cursor: pointer;
      padding: 12px 0;
      opacity: 0;
      transition: color 0.2s;
      text-transform: uppercase;
    }

    .splash-enter:hover { color: var(--black); }

    /* Arrow nudge on hover */
    .splash-enter .arr {
      display: inline-block;
      transition: transform 0.2s;
    }
    .splash-enter:hover .arr { transform: translateX(5px); }

    /* ── Thin bottom line ── */
    .splash-line {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--gray-600);
      opacity: 0;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .splash-obj { font-size: clamp(52px, 22vw, 180px); }
      .splash-num-strip span { font-size: clamp(52px, 22vw, 180px); }
    }
  </style>
</head>
<body>

  <div class="splash" id="splash">
    <p class="splash-eyebrow" id="splashEyebrow">An archive of things worth keeping</p>

    <div class="splash-brand">
      <span class="splash-obj" id="splashObj">OBJ.</span>
      <span class="splash-num-wrap" id="splashNumWrap">
        <div class="splash-num-strip" id="splashNumStrip"></div>
      </span>
    </div>

    <button class="splash-enter" id="splashEnter">
      ENTER ARCHIVE <span class="arr">→</span>
    </button>
  </div>

  <p class="splash-line" id="splashLine">SARATOGA SPRINGS, NY &nbsp;·&nbsp; OBJECTS / RESTORATION / DESIGN</p>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const objEl    = document.getElementById('splashObj');
    const wrap     = document.getElementById('splashNumWrap');
    const strip    = document.getElementById('splashNumStrip');
    const enterBtn = document.getElementById('splashEnter');
    const eyebrow  = document.getElementById('splashEyebrow');
    const line     = document.getElementById('splashLine');

    /* ── Build number strip (00 → 52) ── */
    const TARGET = 52;
    /* Overshoot slightly so there are numbers to race through before easing */
    const TOTAL  = TARGET;
    for (let i = 0; i <= TOTAL; i++) {
      const s = document.createElement('span');
      s.textContent = String(i).padStart(2, '0');
      strip.appendChild(s);
    }

    /* ── Measure one item height after a paint (fonts may not be loaded yet) ── */
    gsap.set(objEl, { x: '-110vw' });
    gsap.set(wrap,  { opacity: 0 });

    requestAnimationFrame(() => {
      const firstSpan = strip.querySelector('span');
      const itemH     = firstSpan.offsetHeight || 180; /* fallback */

      /* Clip window = exactly one row tall */
      wrap.style.height = itemH + 'px';

      /* Strip starts at 0 (top span visible = "00") */
      gsap.set(strip, { y: 0 });

      const tl = gsap.timeline({ delay: 0.15 });

      /* Phase 1a — OBJ. races in from the left, arrives as numbers settle */
      tl.to(objEl, {
        x: 0,
        duration: 2.2,
        ease: 'power3.out',
      }, 0);

      /* Phase 1b — numbers visible immediately; strip scrolls upward fast
         then decelerates very slowly into 52 (expo.out = long, lazy tail) */
      tl.to(wrap,  { opacity: 1, duration: 0.05 }, 0);
      tl.to(strip, {
        y: -(TARGET * itemH),
        duration: 3.6,
        ease: 'expo.out',
      }, 0);

      /* Phase 2 — eyebrow fades in as numbers settle */
      tl.to(eyebrow, { opacity: 1, duration: 0.6, ease: 'power2.out' }, 3.2);

      /* Phase 3 — enter button */
      tl.to(enterBtn, { opacity: 1, duration: 0.55, ease: 'power2.out' }, 3.55);

      /* Phase 4 — footer line */
      tl.to(line, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 3.85);
    });

    /* ── Enter gallery ── */
    enterBtn.addEventListener('click', () => {
      gsap.to('#splash', {
        opacity: 0,
        duration: 0.45,
        ease: 'power2.in',
        onComplete: () => {
          window.location.href = 'gallery.html';
        }
      });
      gsap.to('.splash-line', { opacity: 0, duration: 0.3 });
    });

    /* Allow keyboard Enter too */
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && enterBtn.style.opacity !== '0') enterBtn.click();
    });
  </script>

</body>
</html>
